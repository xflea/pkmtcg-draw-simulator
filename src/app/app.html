<div class="min-h-screen bg-gray-50 py-8 px-4">
  <div class="max-w-4xl mx-auto space-y-6">

    <header class="text-center">
      <h1 class="text-3xl font-bold text-gray-900">PKM TCG Deck Simulator</h1>
      <p class="text-gray-500 mt-1">Paste your decklist and simulate the hands you will draw</p>
    </header>

    <section class="bg-white rounded-xl shadow p-6 space-y-4">
      <div>
        <label class="block font-medium text-gray-700 mb-1">Decklist</label>
        <textarea
          [(ngModel)]="decklistText"
          rows="35"
          class="w-full font-mono text-sm border border-gray-300 rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-indigo-500"
          placeholder="Pokémon: 19&#10;4 Dreepy TWM 128&#10;..."
        ></textarea>
      </div>

      <div class="flex flex-wrap items-end gap-4">
        <div>
          <label class="block text-sm text-gray-600 mb-1">N° of hands</label>
          <input type="number" min="1" max="20" [(ngModel)]="numberOfHands" class="w-24 border border-gray-300 rounded-lg px-2 py-1.5" />
        </div>

        <button
          (click)="drawHands()"
          class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-6 py-2 rounded-lg transition"
        >
          Simulate
        </button>
      </div>

      @if (parseError()) {
        <p class="text-red-600 text-sm">{{ parseError() }}</p>
      }
    </section>

  </div>
</div>
